spring:
  application:
    name: agent-dev-assistant
  ai:
    tools:
      limits:
        max-total-tool-calls: 8
        max-calls-per-tool-default: 4
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:true}
        protocol: STREAMABLE
        type: SYNC
        name: enterprise-requirement-tools
        version: 0.3.0
        instructions: "只读查询企业业务规范与演示数据库元数据，不读取业务数据，不执行写操作。"
        tool-callback-converter: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /api/mcp
          disallow-delete: true
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:mock-not-used}
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
          temperature: 0.1

app:
  ai:
    mode: ${APP_AI_MODE:mock}
  skills:
    location-pattern: classpath*:agent-skills/*/SKILL.md
    manifest-location: classpath:agent-skills/manifest.sha256
    semantic-threshold: 0.42
    max-optional-skills: 2
  workflow:
    repository: ${WORKFLOW_REPOSITORY:memory}
    mysql:
      url: ${WORKFLOW_MYSQL_URL:jdbc:mysql://127.0.0.1:3306/agent_dev_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      username: ${WORKFLOW_MYSQL_USERNAME:agent_app}
      password: ${WORKFLOW_MYSQL_PASSWORD:}
  coding:
    repository: ${CODING_TASK_REPOSITORY:file}
    checkpoint-root: ${CODING_CHECKPOINT_ROOT:F:/agent-workspaces/checkpoints}
    sandbox-root: ${CODING_SANDBOX_ROOT:F:/agent-workspaces/sandboxes}
    approved-root: ${CODING_APPROVED_ROOT:F:/agent-workspaces/approved}
    maven-repository: ${CODING_MAVEN_REPOSITORY:F:/dev/ide/apache-maven-3.9.9/mvn_repo}
    executor:
      core-pool-size: ${CODING_EXECUTOR_THREADS:2}
      queue-capacity: ${CODING_EXECUTOR_QUEUE_CAPACITY:20}
  embedding:
    tokenizer-uri: file:F:/ai-models/bge-small-zh-v1.5/tokenizer.json
    model-uri: file:F:/ai-models/bge-small-zh-v1.5/model_optimized.onnx
    model-output-name: last_hidden_state
    cache-directory: ${EMBEDDING_CACHE_DIRECTORY:F:/ai-models/spring-ai}
    djl-cache-directory: ${DJL_CACHE_DIRECTORY:F:/ai-models/djl}
    similarity-threshold: 0.45
    top-k: 4
    evaluation-thresholds: 0.40,0.45,0.50,0.55

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
