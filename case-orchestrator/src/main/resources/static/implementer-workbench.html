<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实施方案工作台</title><link rel="stylesheet" href="/case-ui.css"></head>
<body><main class="shell"><header><div><span class="badge">内部实施工作台</span><h1>从客户原始需求到可评审实施方案</h1><div class="sub">由实施人员录入并澄清客户需求；事实结论必须绑定客户、MES 版本与来源 Chunk，证据不足时保持待核实。</div></div></header>
<section id="loginPanel" class="panel"><h2>本地演示身份</h2><div class="grid-3"><div><label>实施人员</label><input id="userId" value="implementer-user"></div><div><label>负责客户</label><input id="tenantId" value="customer-a"></div><div><label>角色</label><input value="IMPLEMENTER" disabled></div></div><div class="actions"><button onclick="login()">进入工作台</button></div></section>
<section id="workspace" class="hidden"><div class="grid"><section class="panel"><h2>录入客户需求</h2><label>客户原始描述</label><textarea id="requirement" placeholder="粘贴会议纪要、工单或群聊中确认的业务需求"></textarea><div class="grid-3"><div><label>系统</label><input id="systemId" value="mes"></div><div><label>客户当前版本</label><input id="systemVersion" value="v13.1"></div><div><label>业务模块</label><input id="module" value="订单管理"></div></div><div class="actions"><button onclick="createCase()">创建实施 Case</button></div></section><section class="panel"><h2>待办 Case</h2><div id="caseList"></div></section></div><section class="panel"><h2>处理进度</h2><div id="progress" class="muted">请选择一个 Case</div><div class="actions"><button class="danger" onclick="cancelCase()">取消 Case</button></div><div id="clarifications"></div></section><section id="technical" class="panel hidden"><h2>技术方案与证据</h2><div id="evidence"></div><label>方案 JSON（修改会产生新修订版）</label><textarea id="solutionJson" style="min-height:360px"></textarea><label>修改原因</label><input id="changeReason" value="实施人员核对业务证据后修订"><div class="actions"><button class="secondary" onclick="saveSolution()">保存修订</button><button class="danger" onclick="rejectCase()">驳回</button><button class="success" onclick="approveCase()">确认并生成客户沟通稿</button></div><div id="businessDraft"></div></section></section><div id="message"></div>
</main><script>
const TOKEN_KEY='case_implementer_token';let selectedCaseId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function token(){return localStorage.getItem(TOKEN_KEY)}async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token())headers.Authorization='Bearer '+token();const r=await fetch(path,{...options,headers});const text=await r.text();const data=text?JSON.parse(text):null;if(!r.ok)throw new Error(data?.message||('HTTP '+r.status));return data}function msg(t,type='notice'){ $('message').innerHTML=`<div class="${type}">${esc(t)}</div>`;setTimeout(()=>{$('message').innerHTML=''},5000)}
async function login(){try{const r=await api('/api/dev/token',{method:'POST',body:JSON.stringify({userId:$('userId').value,tenantId:$('tenantId').value,role:'IMPLEMENTER'})});localStorage.setItem(TOKEN_KEY,r.accessToken);show();await loadCases()}catch(e){msg(e.message,'notice error')}}function show(){$('loginPanel').classList.add('hidden');$('workspace').classList.remove('hidden')}
async function createCase(){try{const data=await api('/api/cases',{method:'POST',headers:{'Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({requirement:$('requirement').value,system:{systemId:$('systemId').value,systemVersion:$('systemVersion').value,module:$('module').value}})});msg('实施 Case 已创建','notice ok');await loadCases();await openCase(data.caseId)}catch(e){msg(e.message,'notice error')}}
async function loadCases(){try{const items=await api('/api/cases?limit=50');$('caseList').innerHTML=items.map(x=>`<div class="case" onclick="openCase('${x.caseId}')"><strong>${esc(x.title)}</strong><span class="status">${esc(x.stage)}</span><div class="muted">${esc(x.system.systemVersion)} · ${esc(x.system.module)}</div></div>`).join('')||'暂无 Case'}catch(e){msg(e.message,'notice error')}}
async function openCase(id){selectedCaseId=id;try{const p=await api('/api/cases/'+id);$('progress').innerHTML=`<b>${esc(p.title)}</b><div class="notice">${esc(p.stage)} · ${p.evidenceCount} 条证据</div>`+(p.unresolvedEvidence||[]).map(x=>`<div class="notice">${esc(x)}</div>`).join('');renderClarifications(p);const t=await api(`/api/cases/${id}/technical-proposal`);$('technical').classList.remove('hidden');$('solutionJson').value=t.solution?JSON.stringify(t.solution,null,2):'';$('evidence').innerHTML='<h3>证据包</h3>'+(t.evidence?.evidence||[]).map(e=>`<div class="evidence"><b>${esc(e.title)}</b><br><small>${esc(e.source)} · ${esc(e.chunkId)} · ${esc(e.retrievalMode||'A2A RAG')} · semantic ${esc(e.semanticScore??'-')} · lexical ${esc(e.lexicalScore??'-')}</small><p>${esc(e.content)}</p></div>`).join('')+(t.evidence?.unresolved||[]).map(u=>`<div class="notice">待核实：${esc(u)}</div>`).join('');if(p.stage==='PUBLISHED')await loadBusinessDraft()}catch(e){msg(e.message,'notice error')}}
function renderClarifications(p){const root=$('clarifications');if(p.stage!=='WAITING_FOR_CLARIFICATION'){root.innerHTML='';return}root.innerHTML='<h3>需要向客户确认</h3><p class="muted">实施人员通过原有沟通渠道确认后，将答案记录在这里。</p>'+p.clarificationQuestions.map(q=>`<div><label>${esc(q.question)}</label><input data-question="${esc(q.question)}" value="${esc(q.recommendedAnswer||'')}"></div>`).join('')+'<div class="actions"><button onclick="submitClarifications()">记录客户反馈并继续</button></div>'}
async function submitClarifications(){const answers={};document.querySelectorAll('#clarifications input').forEach(i=>answers[i.dataset.question]=i.value);try{await api(`/api/cases/${selectedCaseId}/clarifications`,{method:'POST',body:JSON.stringify({answers})});msg('客户反馈已记录，工作流继续','notice ok');await openCase(selectedCaseId)}catch(e){msg(e.message,'notice error')}}
async function saveSolution(){try{await api(`/api/cases/${selectedCaseId}/technical-proposal`,{method:'PUT',body:JSON.stringify({solution:JSON.parse($('solutionJson').value),changeReason:$('changeReason').value})});msg('已保存为新的不可变修订版','notice ok');await openCase(selectedCaseId)}catch(e){msg(e.message,'notice error')}}
async function rejectCase(){const comment=prompt('填写驳回原因');if(!comment)return;try{await api(`/api/cases/${selectedCaseId}/reject`,{method:'POST',body:JSON.stringify({comment})});msg('已驳回，未向客户发布','notice ok');await loadCases();await openCase(selectedCaseId)}catch(e){msg(e.message,'notice error')}}
async function approveCase(){const comment=prompt('填写确认说明','证据与版本已核对，可以生成客户沟通稿');if(!comment)return;try{await api(`/api/cases/${selectedCaseId}/approve`,{method:'POST',body:JSON.stringify({comment})});msg('已确认并生成客户沟通稿','notice ok');await loadCases();await openCase(selectedCaseId)}catch(e){msg(e.message,'notice error')}}
async function cancelCase(){if(!selectedCaseId)return;const comment=prompt('填写取消原因');if(!comment)return;try{await api(`/api/cases/${selectedCaseId}/cancel`,{method:'POST',body:JSON.stringify({comment})});msg('Case 已取消，已尝试取消远端知识调查','notice ok');await loadCases();await openCase(selectedCaseId)}catch(e){msg(e.message,'notice error')}}
async function loadBusinessDraft(){const p=await api(`/api/cases/${selectedCaseId}/business-proposal`);$('businessDraft').innerHTML=`<h3>客户沟通稿</h3><p>${esc(p.summary)}</p><h4>影响模块</h4><ul>${p.affectedModules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h4>验收标准</h4><ul>${p.acceptanceCriteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
if(token()){show();loadCases()}
</script></body></html>
